name: Forecast refresh

# Runs the whole pipeline against fresh poll data and reports what it found.
#
# It deliberately does NOT publish. A forecast that republishes unattended is
# one bad input away from putting a confident wrong number in front of people,
# and this page has already shipped broken once (three charts silently not
# drawing) and could once have rendered a fabricated "0% chance of a majority".
# So: run it, check it, show the numbers and the diff, and leave publishing to
# a human. Revisit once it has proven itself over a few cycles.

on:
  schedule:
    - cron: "0 20 * * *"     # 06:00 Melbourne (AEST, UTC+10) daily
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip the slow stages: federal and NSW cycles, and the candidate-level seat model with its S5 check"
        type: boolean
        default: false
      alarm_test:
        description: "Also raise the failure alarm on this manual run, to prove the alarm still fires"
        type: boolean
        default: false

permissions:
  contents: read
  # Needed only by the "Raise an alarm" step below, which opens or updates one
  # tracking issue when a SCHEDULED run fails. Narrowed from read-all rather
  # than widened: everything else here still only reads.
  issues: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::jsonlite
          needs: check

      # The anchor's poll data is a separate public repository and is never
      # committed here. A shallow, sparse clone of analysis/ pulls the CSVs and
      # seat files without the bitmaps, downloads and maps directories.
      - name: Fetch the anchor's poll data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/d-j-hirst/aus-polling-analyser \
            external/aus-polling-analyser
          git -C external/aus-polling-analyser sparse-checkout set analysis
          echo "anchor at $(git -C external/aus-polling-analyser rev-parse --short HEAD)"
          ls external/aus-polling-analyser/analysis/Data/poll-data-*.csv

      # Election-commission results for the candidate-level seat model. Both
      # sources are public and unauthenticated, and neither is committed --
      # neither commission publishes a licence. The 2022 Victorian and 2026
      # South Australian results are HISTORICAL and immutable, so this is
      # cached rather than refetched daily: 176 VEC page requests every morning
      # for data that cannot change would be rude as well as slow, and it would
      # make the forecast fail whenever the VEC has an outage.
      # restore/save split rather than the combined action, whose save runs in
      # a POST step that executes even when an earlier step failed. A fetch
      # dying partway through 176 VEC requests would otherwise cache the
      # partial directory under a key that does not change until the fetch
      # scripts do, and every later run would restore it, skip the fetch, and
      # quietly produce no candidate-level forecast behind a green build.
      - name: Restore cached election results
        id: elections-cache
        uses: actions/cache/restore@v4
        with:
          path: external/elections
          key: elections-v5-${{ hashFiles('scripts/fetch_preferences_*.R', 'scripts/transpose_federal_to_state.R') }}

      - name: Fetch election results
        id: fetch-elections
        if: steps.elections-cache.outputs.cache-hit != 'true'
        run: |
          Rscript scripts/fetch_preferences_sa.R
          Rscript scripts/fetch_preferences_vic.R
          Rscript scripts/fetch_preferences_qld.R
          # NOT HERE, and it blocks the seat model: the four fetchers
          # scripts/estimate_statewide_cov.R needs for its ten election pairs
          # -- fetch_preferences_fed.R, _nsw.R, _vic_historical.R and
          # fetch_sa2022_and_winners.R. Added 2026-09-03 and reverted the same
          # hour, because _nsw.R cannot run on a GitHub runner:
          #
          #   Error: Download for 2019 is not a readable workbook with a Data
          #   sheet (found: )
          #
          # pastvtr.elections.nsw.gov.au serves that workbook fine from a
          # developer machine (HTTP 200, 1,186,469 bytes, correct xlsx content
          # type, same User-Agent) and serves the runner something that is not
          # a zip. download.file() does not raise on it; the workbook guard
          # does, which is that guard doing exactly its job.
          #
          # It has to be all four or none. Dropping just the NSW pair would
          # change the fitted covariance and therefore the published forecast,
          # silently, which is worse than not running.
          #
          # Leaving them in made things WORSE than leaving them out: the fetch
          # step failed, so the cache never saved, and every run refetched
          # everything from cold and still failed.
          Rscript scripts/transpose_federal_to_state.R
          cat external/elections/MANIFEST.csv

      - name: Cache election results
        if: steps.fetch-elections.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: external/elections
          key: elections-v5-${{ hashFiles('scripts/fetch_preferences_*.R', 'scripts/transpose_federal_to_state.R') }}

      - name: Run the pipeline
        id: run
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            Rscript scripts/run_all.R --quick 2>&1 | tee run.log
          else
            Rscript scripts/run_all.R 2>&1 | tee run.log
          fi
        shell: bash

      # The point of the schedule is to notice CHANGE, so put the numbers and
      # every pre-registered check in the run summary rather than burying them
      # in a log nobody opens.
      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo "## Forecast refresh"
            echo
            if [ -f output/vic-page-data.json ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("output/vic-page-data.json"))
          p, s, m = d["proj"], d["seats"], d["meta"]
          print(f"**Labor two-party {p['mean']}%** ({p['lo']}–{p['hi']}) · "
                f"**{s['median']} of {s['total']} seats** ({s['q05']}–{s['q95']}) · "
                f"P(majority) **{s['p_majority']*100:.0f}%**")
          print()
          print(f"- {m['days_out']} days to the election · latest poll {m['latest_poll']} "
                f"· {m['n_polls_cycle']} polls this term")
          print(f"- data status: **{d.get('data_status','?')}**")
          PY
            else
              echo "_No forecast produced — the pipeline did not reach the page stage._"
            fi
            echo
            echo "### Checks"
            echo '```'
            # A SEPARATE, hand-maintained letter enumeration here had already
            # drifted from run_all.R's own filter -- it never matched a
            # two-letter code prefix (CV, FL, NL: run_all.R's own comment names
            # them as needed for region-scoped checks) or a "!" terminator
            # (this repo's convention for "the check fired"). Every CV0!/CV1!/
            # S5! line -- the whole point of this step -- was invisible here.
            # Found 2026-09-13 fixing an unrelated crash whose own diagnostic
            # output would otherwise have gone the same way. Matched to
            # run_all.R's regex instead of a second hand-kept list, since two
            # independently-maintained copies of the same pattern is exactly
            # how it drifted the first time.
            grep -E "^[A-Z]{1,3}[0-9]+[a-c]?[ !]" run.log | head -40 || echo "(none captured)"
            echo '```'
            if grep -q "WARNINGS from this stage" run.log; then
              echo "### Warnings"
              echo '```'
              grep -A3 "WARNINGS from this stage" run.log | head -30
              echo '```'
            fi
            # What failed, against what we already knew about. Shown on EVERY
            # run, including green ones -- that is how anyone finds out a
            # baseline line is stale and ready to delete.
            if [ -f run.log ]; then
              echo "### Failures vs the known baseline"
              echo '```'
              sh scripts/failure_signature.sh run.log .github/known-failures.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept so a human can download and eyeball the page before publishing it.
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_number }}
          path: |
            output/victoria-2026.html
            output/vic-page-data.json
            output/projection-mix.csv
            output/seats-vic-2026.csv
            run.log
          retention-days: 30
          if-no-files-found: warn

      # NOTHING WATCHED THIS JOB. It failed every scheduled run from 2026-09-10
      # to 09-14 and that was found only because someone happened to open the
      # Actions tab; the same thing had happened before (NEWS 0.4.33 records
      # the run failing from 09-03). A red scheduled build that nobody sees is
      # the same as no build, and worse than none while it is still believed to
      # be green.
      #
      # SCHEDULED RUNS ONLY. A workflow_dispatch failure is usually someone
      # debugging on purpose and should not raise an alarm.
      #
      # EXCEPT with alarm_test=true, so this can be PROVEN to still fire. A
      # schedule-only condition is untestable by construction, and this repo's
      # own rule is to prove a check fails on deliberately broken input rather
      # than trust that it would. The input makes that a repeatable act, not a
      # one-off done the day it was written.
      #
      # ONE issue, reopened and commented rather than a new one nightly --
      # otherwise a week of failures buries the repo in duplicates and the
      # alarm becomes the thing people learn to ignore.
      - name: Raise an alarm
        if: failure() && (github.event_name == 'schedule' || inputs.alarm_test)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Forecast refresh is failing"

          # FIRE ON A CHANGE, NOT ON REDNESS.
          #
          # The scheduled run has been red continuously, so an alarm keyed on
          # "the run failed" opens or comments an issue every single night for
          # something already known -- and an alarm that speaks every night is
          # one people stop reading. That is the exact failure the comments
          # further up this file were written to prevent, arriving through the
          # alarm rather than through silence.
          #
          # Muting it would be worse: a NEW failure would hide behind the old
          # one. So the alarm compares what failed against
          # .github/known-failures.txt, and speaks only about what is not
          # already accounted for there. The run still exits non-zero either
          # way -- the build status should honestly say something is breaching;
          # this decides only whether a human gets told.
          #
          # The comparison is scripts/failure_signature.sh, not inline shell,
          # because both previous defects in this alarm were in untested inline
          # shell: a grep matching none of the shapes run_all.R emits, and a
          # comment contradicting the code beneath it. That script is proven by
          # scripts/test_failure_signature.sh against real logs from both sides
          # of a fixed failure.
          set +e
          DIFF="$(sh scripts/failure_signature.sh run.log .github/known-failures.txt 2>&1)"
          NEW=$?
          set -e
          echo "$DIFF"
          if [ "$NEW" = "0" ]; then
            echo "No alarm: every failure this run is already in .github/known-failures.txt."
            {
              echo "### Alarm not raised"
              echo
              echo "Every failure is already known. Details in the run summary above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$NEW" != "1" ]; then
            # Exit 2 means the script could not read a file. That is not "no
            # new failures" and must not be treated as one.
            echo "failure_signature.sh could not run (exit $NEW); alarming anyway."
          fi
          # Which stages actually failed, so the issue is readable without
          # opening the log. run.log may not exist if the job died early.
          # MATCH EVERY SHAPE run_all.R EMITS, not just one. The first version
          # matched only CHECK FAILED / VALIDATION STAGE FAILED and reported
          # "no stage lines captured" on a run whose log said
          # "FAILED (unclassified): scripts/build_page.R" -- an alarm claiming
          # it has no detail when the detail is right there is the same class
          # of misleading-but-plausible output this step exists to surface.
          STAGES="$(grep -E 'CHECK FAILED|VALIDATION STAGE FAILED|FAILED \(unclassified\)|^Error' run.log 2>/dev/null | head -10 || true)"
          if [ -z "$STAGES" ]; then
            if [ -f run.log ]; then
              STAGES="$(printf '(no recognised failure line; last lines of run.log)\n%s' "$(tail -5 run.log)")"
            else
              STAGES="(run.log does not exist -- the job failed before the pipeline step)"
            fi
          fi
          BODY=$(printf '%s\n\n```\n%s\n```\n\n## What failed\n\n```\n%s\n```\n\nRun: %s\n\nThis issue is raised only for failures NOT already listed in `.github/known-failures.txt`, so everything under "NEW failures" above is something that changed. If one of them is a failure to live with rather than fix, add its token to that file WITH A REASON -- the alarm will then stay quiet about it and tell you when it stops failing.\n\nThis issue is reused for every consecutive alarm rather than opening a new one. Close it when the run is green again.' \
                 "The nightly forecast refresh failed with something new." "$STAGES" "$DIFF" "$RUN_URL")
          # EXACT title match, filtered client-side. `--search ... in:title` is
          # fuzzy and this repo already has an open issue whose title contains
          # "Forecast refresh" -- a false match would comment there forever and
          # never raise the real alarm, which is precisely the silent failure
          # this step exists to prevent.
          # (gh's own --jq takes no --arg, so pipe to jq proper; it is preinstalled
          # on ubuntu-latest.)
          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
                      | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

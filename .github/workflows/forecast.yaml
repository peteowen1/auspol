name: Forecast refresh

# Runs the whole pipeline against fresh poll data and PUBLISHES the result to
# the forecast-latest release (and, once the secrets exist, the inthegame-data
# R2 bucket for the blog). Publishing became unattended on 2026-09-19; the
# guards that make that tolerable are below: the models must be recent, every
# input must be non-empty, the Victorian outputs must have been written by
# THIS run, and a validation breach elsewhere is a warning, not a publish.

on:
  schedule:
    - cron: "0 20 * * *"     # 06:00 Melbourne (AEST, UTC+10) daily
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip the slow stages: federal and NSW cycles, and the candidate-level seat model with its S5 check"
        type: boolean
        default: false
      alarm_test:
        description: "Also raise the failure alarm on this manual run, to prove the alarm still fires"
        type: boolean
        default: false

permissions:
  # contents: write is for the "Publish the forecast" step, which uploads the
  # day's outputs to the forecast-latest release (release-as-data-bus). The
  # first run with that step failed on "HTTP 403: Resource not accessible by
  # integration" under contents: read (2026-09-19, run 35423528402). Releases
  # are the only thing written; the workflow never pushes to a branch.
  contents: write
  # Needed only by the "Raise an alarm" step below, which opens or updates one
  # tracking issue when a SCHEDULED run fails.
  issues: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::jsonlite
          needs: check

      # The anchor's poll data is a separate public repository and is never
      # committed here. A shallow, sparse clone of analysis/ pulls the CSVs and
      # seat files without the bitmaps, downloads and maps directories.
      - name: Fetch the anchor's poll data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/d-j-hirst/aus-polling-analyser \
            external/aus-polling-analyser
          git -C external/aus-polling-analyser sparse-checkout set analysis
          echo "anchor at $(git -C external/aus-polling-analyser rev-parse --short HEAD)"
          # Recorded into forecast-vic2026.json (poll_source) and the poll file
          # is snapshotted onto the release, so any day's forecast can be
          # reproduced from what it actually read (roadmap 2026-09-19).
          echo "AUSPOL_ANCHOR_SHA=$(git -C external/aus-polling-analyser rev-parse HEAD)" >> "$GITHUB_ENV"
          ls external/aus-polling-analyser/analysis/Data/poll-data-*.csv

      # Election-commission results for the candidate-level seat model. Both
      # sources are public and unauthenticated, and neither is committed --
      # neither commission publishes a licence. The 2022 Victorian and 2026
      # South Australian results are HISTORICAL and immutable, so this is
      # cached rather than refetched daily: 176 VEC page requests every morning
      # for data that cannot change would be rude as well as slow, and it would
      # make the forecast fail whenever the VEC has an outage.
      # restore/save split rather than the combined action, whose save runs in
      # a POST step that executes even when an earlier step failed. A fetch
      # dying partway through 176 VEC requests would otherwise cache the
      # partial directory under a key that does not change until the fetch
      # scripts do, and every later run would restore it, skip the fetch, and
      # quietly produce no candidate-level forecast behind a green build.
      - name: Restore cached election results
        id: elections-cache
        uses: actions/cache/restore@v4
        with:
          path: external/elections
          key: elections-v5-${{ hashFiles('scripts/fetch_preferences_*.R', 'scripts/transpose_federal_to_state.R') }}

      - name: Fetch election results
        id: fetch-elections
        if: steps.elections-cache.outputs.cache-hit != 'true'
        run: |
          Rscript scripts/fetch_preferences_sa.R
          Rscript scripts/fetch_preferences_vic.R
          Rscript scripts/fetch_preferences_qld.R
          # NOT HERE, and it blocks the seat model: the four fetchers
          # scripts/estimate_statewide_cov.R needs for its ten election pairs
          # -- fetch_preferences_fed.R, _nsw.R, _vic_historical.R and
          # fetch_sa2022_and_winners.R. Added 2026-09-03 and reverted the same
          # hour, because _nsw.R cannot run on a GitHub runner:
          #
          #   Error: Download for 2019 is not a readable workbook with a Data
          #   sheet (found: )
          #
          # pastvtr.elections.nsw.gov.au serves that workbook fine from a
          # developer machine (HTTP 200, 1,186,469 bytes, correct xlsx content
          # type, same User-Agent) and serves the runner something that is not
          # a zip. download.file() does not raise on it; the workbook guard
          # does, which is that guard doing exactly its job.
          #
          # It has to be all four or none. Dropping just the NSW pair would
          # change the fitted covariance and therefore the published forecast,
          # silently, which is worse than not running.
          #
          # Leaving them in made things WORSE than leaving them out: the fetch
          # step failed, so the cache never saved, and every run refetched
          # everything from cold and still failed.
          Rscript scripts/transpose_federal_to_state.R
          cat external/elections/MANIFEST.csv

      - name: Cache election results
        if: steps.fetch-elections.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: external/elections
          key: elections-v5-${{ hashFiles('scripts/fetch_preferences_*.R', 'scripts/transpose_federal_to_state.R') }}

      # THE TRAINED MODELS THE PUBLISHED CONFIG ASKS FOR.
      #
      # Without this step the nightly forecast was NOT the model we measure.
      # published_flags.R ships AUSPOL_XGB_PRIMARY_LIVE=1 and AUSPOL_XGB_FLOWS=1,
      # so the pipeline asks for the XGBoost primary replacement and the
      # per-seat conditional flows -- and on a runner neither model file exists,
      # because they are far too big for git and live in the shipped-models
      # release instead. Both components fall back and SAY SO:
      #
      #   XG4!  xgb-primary-v6-final.model missing -- shares unchanged
      #   XF9!  model/cols/features file missing -- override skipped
      #   XF4!! xgb_flow_conditional_override_for() FAILED -- flows UNCHANGED
      #
      # Announced on every run since the flags shipped, and unread. That is the
      # same class of failure published_flags.R exists to prevent -- what runs
      # differing from what we validate -- arriving through missing artifacts
      # instead of drifting flags.
      #
      # AN EXPLICIT ALLOWLIST, NOT THE WHOLE RELEASE. shipped-models also holds
      # OUTPUTS: seat-probs-vic-2026.csv, victoria-2026.html, level-pred.csv.
      # Downloading those into output/ would seed the run with a previous
      # forecast's results, and build_page.R -- which is not a `slow` stage and
      # so runs even on --quick -- would publish them if fit_seats_full.R
      # failed. A stale forecast behind a green build is exactly what the
      # elections-cache comment above guards against, and it would be far
      # harder to notice here.
      #
      # NOT the LOO models either (xgb-flows-v1-loo-models.zip, 8MB). Those
      # exist for leakage-free BACKTESTS; the live Victorian forecast has no
      # LOO model of its own -- XF9 records that vic2026 is not in the flow
      # training corpus -- so it correctly uses the final model.
      - name: Fetch the trained models
        run: |
          set -euo pipefail
          for f in xgb-primary-v6-final.model xgb-primary-v6-final-cols.json \
                   xgb-flows-v1-final.model xgb-flows-v1-final-cols.json \
                   xgb-flows-v1-features.csv xgb-primary-v6-features.csv candidacies.csv; do
            gh release download shipped-models -p "$f" -D output --clobber
          done
          # Seed-ensemble members (AUSPOL_XGB_ENSEMBLE): the manifest is optional
          # (a release without it is a single model); every member it lists must arrive.
          # A release that LISTS the manifest must deliver it: a failed download
          # would otherwise run one model while the backtests used K (review).
          if gh release view shipped-models --json assets --jq '.assets[].name' | grep -qx 'xgb-primary-v6-final-ensemble.json'; then
            gh release download shipped-models -p xgb-primary-v6-final-ensemble.json -D output --clobber || { echo "::error::ensemble manifest listed on the release but failed to download"; exit 1; }
          fi
          if [ -s output/xgb-primary-v6-final-ensemble.json ]; then
            for m in $(python3 -c "import json;print(' '.join(json.load(open('output/xgb-primary-v6-final-ensemble.json'))))"); do
              [ "$m" = "xgb-primary-v6-final.model" ] && continue
              gh release download shipped-models -p "$m" -D output --clobber
              [ -s "output/$m" ] || { echo "::error::ensemble member $m missing after download"; exit 1; }
            done
          fi
          # The seat-swing port's table (v48). Tolerant: a release published
          # before v48 lacks it, and fit_seats_full.R then runs unported and
          # prints SP2!! rather than failing the whole forecast.
          gh release download shipped-models -p seat-swing-port-vic2026.csv -D output --clobber             || echo "::warning::shipped-models has no seat-swing-port-vic2026.csv -- the forecast runs WITHOUT the v48 seat-swing port"
          gh release download shipped-models -p seat-poll-blend-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no seat-poll-blend-vic2026.csv -- the forecast runs WITHOUT the v50 seat-poll blend"
          gh release download shipped-models -p leader-seat-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no leader-seat-vic2026.csv -- the forecast runs WITHOUT the leader-seat bonus"
          gh release download shipped-models -p demo-resid-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no demo-resid-vic2026.csv -- the forecast runs WITHOUT the demographic correction"
          gh release download shipped-models -p seat-poll-joint-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no seat-poll-joint-vic2026.csv -- AUSPOL_SEAT_POLL_BLEND=3 runs WITHOUT the joint blend"
          gh release download shipped-models -p departed-fed-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no departed-fed-vic2026.csv -- the forecast runs WITHOUT the departed-member blend"
          # AUSPOL_DEPARTED_SUCCESSOR (published "1"): fit_seats_full.R stops without the rate
          # table, and running with the switch off would trip its published-filename guard,
          # so a missing table fails here, loudly, and yesterday's forecast stays live.
          gh release download shipped-models -p departed-successor-rates.csv -D output --clobber || { echo "::error::shipped-models has no departed-successor-rates.csv -- promote_rebuild.R uploads it at stage 9; publish the rebuild before this runs"; exit 1; }
          gh release download shipped-models -p endorsement-features.csv -D output --clobber || echo "::warning::shipped-models has no endorsement-features.csv -- a model trained with AUSPOL_XGB_ENDORSE=1 gets all-zero endorsement features"
          gh release download shipped-models -p upset-floor-eps.csv -D output --clobber || echo "::warning::shipped-models has no upset-floor-eps.csv -- AUSPOL_UPSET_FLOOR=1 stops fit_seats_full.R (UF0!)"
          gh release download shipped-models -p booth-features-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no booth-features-vic2026.csv -- a model trained with AUSPOL_XGB_BOOTH=1 gets NA booth features (XB1!!)"
          gh release download shipped-models -p council-history-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no council-history-vic2026.csv -- a model trained with AUSPOL_XGB_COUNCIL=1 gets all-zero council features (XC1!!)"
          gh release download shipped-models -p senate-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no senate-vic2026.csv -- a model trained with AUSPOL_XGB_SENATE=1 gets NA Senate features (XS1!!)"
          gh release download shipped-models -p onp-senate-vic2026.csv -D output --clobber || echo "::warning::shipped-models has no onp-senate-vic2026.csv -- AUSPOL_ONP_ORDER=senate falls back to the House-rank One Nation rule (ONP1!!)"
          ls -l output/xgb-*
          # The forecast history table lives on the forecast-latest release;
          # fetch it BEFORE run_all.R so build_forecast_json.R appends one row.
          gh release download forecast-latest -p forecast-history.csv -D output --clobber 2>/dev/null || echo "no forecast-history.csv yet (first run)"
          # STALENESS: the models must not lag the code. 2026-09-19: they were
          # eight days and ~40 commits behind main and nobody noticed. Warn
          # loudly past 3 days; fail past 14 (a rebuild takes 25 minutes).
          # A missing or unreadable manifest degrades to a warning, never a
          # failed forecast (review gate, 2026-09-19).
          if gh release download shipped-models -p MANIFEST.json -D output --clobber 2>/dev/null; then
            promoted=$(python3 -c "import json;print(json.load(open('output/MANIFEST.json'))['promoted_at'][:10])" 2>/dev/null) || promoted=""
            if [ -n "$promoted" ]; then
              age=$(( ( $(date +%s) - $(date -d "$promoted" +%s) ) / 86400 ))
              echo "shipped models promoted $promoted ($age days ago)"
              if [ "$age" -gt 14 ]; then echo "::error::shipped models are $age days old -- run scripts/rebuild_forecasts.sh with AUSPOL_PUBLISH=1"; exit 1; fi
              if [ "$age" -gt 3 ]; then echo "::warning::shipped models are $age days old"; fi
            else
              echo "::warning::could not read promoted_at from MANIFEST.json -- staleness unchecked"
            fi
          else
            echo "::warning::shipped-models release has no MANIFEST.json -- staleness unchecked"
          fi
          # A truncated or absent download must fail HERE, loudly, rather than
          # surfacing as a fallback line in a log nobody reads. This repo has
          # already lost a seat to a 65536-byte partial download that passed a
          # size guard, so PARSE each file rather than measuring it.
          #
          # ALL FIVE, not just the two models. The first version checked only
          # the .model files, leaving the two cols.json files and the features
          # CSV unverified -- and those are read UNGUARDED by
          # R/xgb_primary_override.R and R/xgb_flow_override.R, inside a .try()
          # in fit_seats_full.R that turns any error into "XG4!! ... shares
          # UNCHANGED". So a corrupt-but-present cols.json would arrive as
          # exactly the silent fallback this step exists to eliminate, through
          # a path that already exists for a legitimate reason and so cannot be
          # relied on to shout. Found by review, 2026-09-14.
          for f in output/xgb-primary-v6-final.model output/xgb-primary-v6-final-cols.json \
                   output/xgb-flows-v1-final.model output/xgb-flows-v1-final-cols.json \
                   output/xgb-flows-v1-features.csv output/xgb-primary-v6-features.csv output/candidacies.csv; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty after download"; exit 1; }
          done
          # candidacies.csv is the candidate-name corpus every identity mechanism
          # reads (candidate_returns, surge hazard). It cannot be built on CI, so
          # it ships with the models; a header-only file must fail here too.
          [ "$(wc -l < output/candidacies.csv)" -gt 1000 ] || { echo "::error::output/candidacies.csv has fewer than 1000 rows"; exit 1; }
          Rscript -e '
            for (f in c("output/xgb-primary-v6-final.model", "output/xgb-flows-v1-final.model")) {
              m <- xgboost::xgb.load(f); cat(sprintf("%s loads OK\n", f))
            }
            for (f in c("output/xgb-primary-v6-final-cols.json", "output/xgb-flows-v1-final-cols.json")) {
              j <- jsonlite::fromJSON(readLines(f, warn = FALSE))
              if (!length(j)) stop(f, " parsed to zero columns")
              cat(sprintf("%s parses OK (%d columns)\n", f, length(j)))
            }
            f <- "output/xgb-flows-v1-features.csv"
            d <- data.table::fread(f, showProgress = FALSE)
            if (!nrow(d)) stop(f, " parsed to zero rows")
            cat(sprintf("%s parses OK (%d rows, %d cols)\n", f, nrow(d), ncol(d)))
          '
        env:
          GH_TOKEN: ${{ github.token }}

      # A zero-byte input passes file.exists() and every size floor below it;
      # this repo lost a seat to a truncated download once. Fail before the
      # pipeline reads anything (roadmap 2026-09-19, data registry rule).
      - name: Refuse zero-byte inputs
        shell: bash
        run: |
          # Scoped to what the pipeline reads: the anchor's own tree carries
          # unrelated zero-byte files (old-elections.csv, temp.txt), so only the poll files are checked there.
          empty=$(find external/aus-polling-analyser/analysis/Data/poll-data-*.csv external/elections output -type f -size 0 2>/dev/null || true)
          if [ -n "$empty" ]; then echo "::error::zero-byte input file(s):"; echo "$empty"; exit 1; fi
          echo "no zero-byte files among the poll data, election results or downloaded models"
      - name: Run the pipeline
        id: run
        run: |
          # run_all.R exits non-zero when ANY validation stage breaches (2026-09-19:
          # every daily run since at least the 12th had failed on a NSW 2027
          # poll-tracking breach, NL3, and the Victorian forecast -- which had
          # run fine -- was never published). The breach is still reported in
          # the summary and as a warning; it no longer blocks the publish, which
          # is gated instead on the Victorian outputs being written by THIS run.
          if [ "${{ inputs.quick }}" = "true" ]; then
            Rscript scripts/run_all.R --quick 2>&1 | tee run.log || echo "::warning::run_all.R reported validation problems (see run.log); Victorian outputs are checked before publishing"
          else
            Rscript scripts/run_all.R 2>&1 | tee run.log || echo "::warning::run_all.R reported validation problems (see run.log); Victorian outputs are checked before publishing"
          fi
          for f in output/seat-probs-vic-2026.csv output/seat-shares-vic-2026.csv output/seat-sims-full-vic-2026.csv output/forecast-vic2026.json output/vic-page-data.json; do
            [ -s "$f" ] && [ "$(( $(date +%s) - $(stat -c %Y "$f") ))" -lt 7200 ] || { echo "::error::$f missing or not written by this run -- the Victorian forecast did not complete"; exit 1; }
          done
        shell: bash

      # The point of the schedule is to notice CHANGE, so put the numbers and
      # every pre-registered check in the run summary rather than burying them
      # in a log nobody opens.
      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo "## Forecast refresh"
            echo
            if [ -f output/vic-page-data.json ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("output/vic-page-data.json"))
          p, s, m = d["proj"], d["seats"], d["meta"]
          print(f"**Labor two-party {p['mean']}%** ({p['lo']}–{p['hi']}) · "
                f"**{s['median']} of {s['total']} seats** ({s['q05']}–{s['q95']}) · "
                f"P(majority) **{s['p_majority']*100:.0f}%**")
          print()
          print(f"- {m['days_out']} days to the election · latest poll {m['latest_poll']} "
                f"· {m['n_polls_cycle']} polls this term")
          print(f"- data status: **{d.get('data_status','?')}**")
          PY
            else
              echo "_No forecast produced — the pipeline did not reach the page stage._"
            fi
            echo
            echo "### Checks"
            echo '```'
            # A SEPARATE, hand-maintained letter enumeration here had already
            # drifted from run_all.R's own filter -- it never matched a
            # two-letter code prefix (CV, FL, NL: run_all.R's own comment names
            # them as needed for region-scoped checks) or a "!" terminator
            # (this repo's convention for "the check fired"). Every CV0!/CV1!/
            # S5! line -- the whole point of this step -- was invisible here.
            # Found 2026-09-13 fixing an unrelated crash whose own diagnostic
            # output would otherwise have gone the same way. Matched to
            # run_all.R's regex instead of a second hand-kept list, since two
            # independently-maintained copies of the same pattern is exactly
            # how it drifted the first time.
            grep -E "^[A-Z]{1,3}[0-9]+[a-c]?[ !]" run.log | head -40 || echo "(none captured)"
            echo '```'
            if grep -q "WARNINGS from this stage" run.log; then
              echo "### Warnings"
              echo '```'
              grep -A3 "WARNINGS from this stage" run.log | head -30
              echo '```'
            fi
            # What failed, against what we already knew about. Shown on EVERY
            # run, including green ones -- that is how anyone finds out a
            # baseline line is stale and ready to delete.
            if [ -f run.log ]; then
              echo "### Failures vs the known baseline"
              echo '```'
              sh scripts/failure_signature.sh run.log .github/known-failures.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept so a human can download and eyeball the page before publishing it.
      - name: Publish the forecast to the forecast-latest release
        # release-as-data-bus: the ITG page fetches these by fixed URL. The
        # history table is downloaded first so each build appends to it.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view forecast-latest >/dev/null 2>&1 || gh release create forecast-latest -t "Latest forecast (auto-updated)" -n "Assets are replaced by the daily forecast workflow; the release date is the tag's, not the data's. Read built_at inside forecast-vic2026.json."
          # Poll-source snapshot: the anchor's Victorian poll file exactly as
          # this run read it, plus the anchor commit it came from.
          cp external/aus-polling-analyser/analysis/Data/poll-data-vic.csv output/polls-vic-snapshot.csv
          gh release upload forecast-latest output/forecast-vic2026.json output/forecast-history.csv output/seat-probs-vic-2026.csv output/seat-shares-vic-2026.csv output/victoria-2026.html output/polls-vic-snapshot.csv --clobber
      - name: Publish the forecast to R2 for the ITG page
        # The blog (inthegame-blog) fetches every dataset client-side from the
        # inthegame-data R2 bucket; its CSP does not allow github.com, so the
        # release alone is not enough. Same mechanism as pannadata/torpdata's
        # build-blog-data workflows (wrangler r2 object put, 5-minute cache).
        # Public URL: https://pub-ee4bf5b599a047f9ac2b9facc1587008.r2.dev/auspol/forecast-vic2026.json
        if: success()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          # The secrets do not exist on this repo yet (2026-09-19: first run
          # failed here; they live on pannadata/torpdata and Pete has to add
          # them under Settings > Secrets > Actions). Until then this step
          # warns and skips rather than turning every daily run red: the
          # release publish above has already happened, so nothing is lost
          # except the blog feed. Never let wrangler wait on an interactive login.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_R2_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set on this repo -- R2 upload skipped, the ITG page has no data"
            exit 0
          fi
          # Pinned: an unpinned global install of a CLI that holds an API token
          # is a supply-chain hole (commit security review, 2026-09-19).
          npm install -g wrangler@4.135.0 >/dev/null 2>&1
          # vic-page-data.json (poll trend and bands, raw polls, pollster record,
          # seats-by-party ranges) is rebuilt by run_all.R every run; the
          # district map is static and committed (scripts/build_vic_districts_topojson.sh).
          # Both for the ITG Politics redesign, 2026-09-30.
          for f in output/forecast-vic2026.json output/forecast-history.csv output/seat-probs-vic-2026.csv output/seat-shares-vic-2026.csv output/vic-page-data.json web/vic2026-districts.topojson web/vic2022-results.json web/vic2022-booths.json; do
            case "$f" in *.json|*.topojson) ct=application/json ;; *) ct=text/csv ;; esac
            wrangler r2 object put "inthegame-data/auspol/$(basename "$f")" --file "$f" --content-type "$ct" --cache-control "public, max-age=300" --remote
            echo "OK $(basename "$f")"
          done
      - name: Keep a dated copy of the forecast on R2 (as-at history)
        # inthegame-blog#610: the live files above are overwritten every day, so
        # this keeps auspol/history/forecast-vic2026-<date>.json and
        # vic-page-data-<date>.json plus index-vic2026.json. Runs AFTER the live
        # publish and is non-fatal: a history failure never blocks the forecast.
        # Rules and layout: scripts/publish_forecast_history.sh.
        if: success()
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets not set -- forecast history skipped"
            exit 0
          fi
          command -v wrangler >/dev/null || npm install -g wrangler@4.135.0 >/dev/null 2>&1
          bash scripts/publish_forecast_history.sh || { echo "::warning::forecast history step failed; the live forecast is unaffected"; exit 1; }
      - name: NSW 2027 forecast (off until the repository variable AUSPOL_PUBLISH_NSW2027 is 1)
        # Runs AFTER every Victorian publish step (release, R2 feed, dated R2 copy),
        # so a NSW failure turns the run red and raises the alarm but cannot skip
        # them (review 2026-10-08: placed before the R2 steps it would have). Same script, AUSPOL_TARGET=nsw2027 (plans/nsw2027-itg-scope-2026-10-08.md).
        # Its per-target tables and the two NSW election files come from
        # shipped-models (promote_rebuild.R with AUSPOL_PUBLISH_NSW2027=1): the
        # runner cannot fetch NSWEC results itself.
        if: success() && vars.AUSPOL_PUBLISH_NSW2027 == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for f in seat-swing-port-nsw2027.csv seat-poll-blend-nsw2027.csv leader-seat-nsw2027.csv demo-resid-nsw2027.csv council-history-nsw2027.csv; do
            gh release download shipped-models -p "$f" -D output --clobber
          done
          mkdir -p external/elections
          for f in nswec-2023-nsw-firstprefs.csv nswec-nsw-transfers.csv; do
            gh release download shipped-models -p "$f" -D external/elections --clobber
          done
          gh release download forecast-latest -p forecast-history-nsw2027.csv -D output --clobber 2>/dev/null || echo "no forecast-history-nsw2027.csv yet (first run)"
          AUSPOL_TARGET=nsw2027 Rscript scripts/fit_seats_full.R 2>&1 | tee run-nsw2027.log
          AUSPOL_FORECAST_ELECTION=nsw2027 Rscript scripts/build_forecast_json.R
          cp external/aus-polling-analyser/analysis/Data/poll-data-nsw.csv output/polls-nsw-snapshot.csv
          gh release upload forecast-latest output/forecast-nsw2027.json output/forecast-history-nsw2027.csv output/seat-probs-nsw-2027.csv output/seat-shares-nsw-2027.csv output/polls-nsw-snapshot.csv --clobber
      - name: Publish the NSW 2027 forecast to R2 for the ITG page
        # The ITG page reads R2 only (its CSP blocks github.com), so the release
        # alone left the NSW page with no data (found 2026-10-08, first NSW run).
        # Its own step so the R2 secrets never sit in the environment of a step
        # that runs R (review, 2026-10-08).
        if: success() && vars.AUSPOL_PUBLISH_NSW2027 == '1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets not set -- NSW forecast is on the release only"
            exit 0
          fi
          command -v wrangler >/dev/null || npm install -g wrangler@4.135.0 >/dev/null 2>&1
          # The district map is static and committed (scripts/build_nsw_districts_topojson.sh).
          for f in output/forecast-nsw2027.json output/forecast-history-nsw2027.csv output/seat-probs-nsw-2027.csv output/seat-shares-nsw-2027.csv web/nsw2027-districts.topojson; do
            case "$f" in *.json|*.topojson) ct=application/json ;; *) ct=text/csv ;; esac
            wrangler r2 object put "inthegame-data/auspol/$(basename "$f")" --file "$f" --content-type "$ct" --cache-control "public, max-age=300" --remote
            echo "OK $(basename "$f")"
          done
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_number }}
          path: |
            output/victoria-2026.html
            output/vic-page-data.json
            output/projection-mix.csv
            run.log
          retention-days: 30
          if-no-files-found: warn

      # The what-if slider's jobs (below) rerun this exact forecast with one
      # party's vote forced. They need everything this job fetched and built,
      # and only once the Victorian forecast has published: the scenarios
      # describe the published run, and combine_scenarios.R checks that.
      - name: Hand the scenario jobs their inputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-inputs-${{ github.run_id }}
          path: |
            output/
            external/aus-polling-analyser/analysis/
            external/elections/
          retention-days: 2
          if-no-files-found: error

      # NOTHING WATCHED THIS JOB. It failed every scheduled run from 2026-09-10
      # to 09-14 and that was found only because someone happened to open the
      # Actions tab; the same thing had happened before (NEWS 0.4.33 records
      # the run failing from 09-03). A red scheduled build that nobody sees is
      # the same as no build, and worse than none while it is still believed to
      # be green.
      #
      # SCHEDULED RUNS ONLY. A workflow_dispatch failure is usually someone
      # debugging on purpose and should not raise an alarm.
      #
      # EXCEPT with alarm_test=true, so this can be PROVEN to still fire. A
      # schedule-only condition is untestable by construction, and this repo's
      # own rule is to prove a check fails on deliberately broken input rather
      # than trust that it would. The input makes that a repeatable act, not a
      # one-off done the day it was written.
      #
      # ONE issue, reopened and commented rather than a new one nightly --
      # otherwise a week of failures buries the repo in duplicates and the
      # alarm becomes the thing people learn to ignore.
      - name: Raise an alarm
        if: failure() && (github.event_name == 'schedule' || inputs.alarm_test)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Forecast refresh is failing"

          # FIRE ON A CHANGE, NOT ON REDNESS.
          #
          # The scheduled run has been red continuously, so an alarm keyed on
          # "the run failed" opens or comments an issue every single night for
          # something already known -- and an alarm that speaks every night is
          # one people stop reading. That is the exact failure the comments
          # further up this file were written to prevent, arriving through the
          # alarm rather than through silence.
          #
          # Muting it would be worse: a NEW failure would hide behind the old
          # one. So the alarm compares what failed against
          # .github/known-failures.txt, and speaks only about what is not
          # already accounted for there. The run still exits non-zero either
          # way -- the build status should honestly say something is breaching;
          # this decides only whether a human gets told.
          #
          # The comparison is scripts/failure_signature.sh, not inline shell,
          # because both previous defects in this alarm were in untested inline
          # shell: a grep matching none of the shapes run_all.R emits, and a
          # comment contradicting the code beneath it. That script is proven by
          # scripts/test_failure_signature.sh against real logs from both sides
          # of a fixed failure.
          set +e
          DIFF="$(sh scripts/failure_signature.sh run.log .github/known-failures.txt 2>&1)"
          NEW=$?
          set -e
          echo "$DIFF"
          if [ "$NEW" = "0" ]; then
            echo "No alarm: every failure this run is already in .github/known-failures.txt."
            {
              echo "### Alarm not raised"
              echo
              echo "Every failure is already known. Details in the run summary above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$NEW" != "1" ]; then
            # Exit 2 means the script could not read a file. That is not "no
            # new failures" and must not be treated as one.
            echo "failure_signature.sh could not run (exit $NEW); alarming anyway."
          fi
          # Which stages actually failed, so the issue is readable without
          # opening the log. run.log may not exist if the job died early.
          # MATCH EVERY SHAPE run_all.R EMITS, not just one. The first version
          # matched only CHECK FAILED / VALIDATION STAGE FAILED and reported
          # "no stage lines captured" on a run whose log said
          # "FAILED (unclassified): scripts/build_page.R" -- an alarm claiming
          # it has no detail when the detail is right there is the same class
          # of misleading-but-plausible output this step exists to surface.
          STAGES="$(grep -E 'CHECK FAILED|VALIDATION STAGE FAILED|FAILED \(unclassified\)|^Error' run.log 2>/dev/null | head -10 || true)"
          if [ -z "$STAGES" ]; then
            if [ -f run.log ]; then
              STAGES="$(printf '(no recognised failure line; last lines of run.log)\n%s' "$(tail -5 run.log)")"
            else
              STAGES="(run.log does not exist -- the job failed before the pipeline step)"
            fi
          fi
          BODY=$(printf '%s\n\n```\n%s\n```\n\n## What failed\n\n```\n%s\n```\n\nRun: %s\n\nThis issue is raised only for failures NOT already listed in `.github/known-failures.txt`, so everything under "NEW failures" above is something that changed. If one of them is a failure to live with rather than fix, add its token to that file WITH A REASON -- the alarm will then stay quiet about it and tell you when it stops failing.\n\nThis issue is reused for every consecutive alarm rather than opening a new one. Close it when the run is green again.' \
                 "The nightly forecast refresh failed with something new." "$STAGES" "$DIFF" "$RUN_URL")
          # EXACT title match, filtered client-side. `--search ... in:title` is
          # fuzzy and this repo already has an open issue whose title contains
          # "Forecast refresh" -- a false match would comment there forever and
          # never raise the real alarm, which is precisely the silent failure
          # this step exists to prevent.
          # (gh's own --jq takes no --arg, so pipe to jq proper; it is preinstalled
          # on ubuntu-latest.)
          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
                      | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # ---- What-if slider (scripts/build_scenarios.R, combine_scenarios.R) -------
  # Pete's primary-vote slider for the ITG page: each of One Nation, Labor,
  # Coalition and Greens forced to nine statewide levels (10 points either side
  # of today, 2.5-point steps), read two ways (gets exactly X / is polling X).
  # 72 forecast runs at ~80 s each locally, so 8 parallel jobs of 9 rather than
  # one long one. Runs only after the Victorian forecast published, and can never
  # block or change it: the forced runs write suffixed files only.
  scenarios:
    needs: refresh
    # A manual --quick run may skip the seat model the scenarios rerun.
    if: ${{ !inputs.quick }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # New South Wales joins only while its forecast is published
        # (AUSPOL_PUBLISH_NSW2027): its outputs are in scenario-inputs then.
        target: ${{ fromJSON(vars.AUSPOL_PUBLISH_NSW2027 == '1' && '["vic2026","nsw2027"]' || '["vic2026"]') }}
        party: [ONP, ALP, LNP, GRN]
        mode: [exact, polled]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::jsonlite
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: scenario-inputs-${{ github.run_id }}
          path: .
      - name: Run the ${{ matrix.target }} ${{ matrix.party }} ${{ matrix.mode }} scenarios
        run: Rscript scripts/build_scenarios.R --target=${{ matrix.target }} --parties=${{ matrix.party }} --modes=${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scn-${{ matrix.target }}-${{ matrix.mode }}-${{ matrix.party }}-${{ github.run_id }}
          path: |
            output/seat-sims-full-*-scn-*
            output/seat-probs-*-scn-*
            output/scenario-logs/
          retention-days: 2
          if-no-files-found: error

  publish-scenarios:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      # combine_scenarios.R needs only these two; the package's full
      # dependency set took ~10 of this job's 12 minutes (run 37735368376).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::data.table, any::jsonlite
      # Inputs FIRST, scenarios second: combine_scenarios.R refuses scenario
      # files older than today's levels, and a download stamps files with the
      # time it lands.
      - uses: actions/download-artifact@v4
        with:
          name: scenario-inputs-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: scn-*-${{ github.run_id }}
          merge-multiple: true
          path: output
      - name: Combine into scenario-<election>.json
        shell: bash
        run: |
          set -e
          Rscript scripts/combine_scenarios.R --target=vic2026
          if [ "${{ vars.AUSPOL_PUBLISH_NSW2027 }}" = "1" ]; then Rscript scripts/combine_scenarios.R --target=nsw2027; fi
      - name: Publish to the forecast-latest release and R2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          files=output/scenario-vic2026.json
          [ -s output/scenario-nsw2027.json ] && files="$files output/scenario-nsw2027.json"
          gh release upload forecast-latest $files --clobber
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets not set -- $files on the release only"
            exit 0
          fi
          npm install -g wrangler@4.135.0 >/dev/null 2>&1
          for f in $files; do
            wrangler r2 object put "inthegame-data/auspol/$(basename "$f")" --file "$f" \n              --content-type application/json --cache-control "public, max-age=300" --remote
            echo "OK $(basename "$f")"
          done

  # The refresh job's alarm cannot see these jobs, and a red job nobody sees is
  # how this workflow went unwatched for a week in September. Same rules as
  # that alarm: scheduled runs (or alarm_test), one reused issue, exact title.
  scenario-alarm:
    needs: [scenarios, publish-scenarios]
    # NOT failure(): at job level that is true when ANY ancestor failed, so a
    # failed refresh would raise this alarm too, saying the forecast published
    # (review, 2026-10-08). Only the scenario jobs' own results count.
    if: always() && (needs.scenarios.result == 'failure' || needs.publish-scenarios.result == 'failure') && (github.event_name == 'schedule' || inputs.alarm_test)
    runs-on: ubuntu-latest
    steps:
      - name: Raise an alarm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="What-if scenarios are failing"
          BODY="The what-if slider's scenario jobs failed after the Victorian forecast published. The forecast itself is unaffected; the ITG slider keeps yesterday's scenario-vic2026.json. Run: $RUN_URL (each scenario job uploads its logs as scn-<mode>-<party>-<run id>)."
          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
                      | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -1)"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

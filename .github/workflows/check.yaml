name: R-CMD-check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    name: R CMD check + tests
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      # The anchor's poll data is a gitignored third-party clone, so it is
      # absent here. Every test that needs it calls skip_if_no_anchor() and
      # skips cleanly; the ~200 that exercise the model on synthetic data,
      # which is where the maths is actually verified, all run.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      # Skips are expected (the anchor data is absent) but a run where
      # EVERYTHING skipped would pass silently while testing nothing.
      - name: Confirm the synthetic-data tests actually ran
        shell: Rscript {0}
        run: |
          res <- as.data.frame(testthat::test_local(reporter = "silent"))
          passed <- sum(res$passed); skipped <- sum(res$skipped)
          cat(sprintf("passed=%d skipped=%d failed=%d\n",
                      passed, skipped, sum(res$failed)))
          if (passed < 150) stop("Only ", passed, " assertions ran - expected 150+")
          if (sum(res$failed) > 0) stop("Test failures")

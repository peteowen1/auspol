# ELECTION-NIGHT BACKUP RUNNER (map #148): break-glass. Nothing starts it on its own. If the laptop running
# scripts/night_vic2026.sh dies on the night, press "Run workflow" (Actions > Election-night backup) with key
# auspol/night/vic2026.json, source web, index = the VEC page linking every district's result page, minutes 330.
# It runs the SAME one command here (the website fetcher plus the night loop), writing the live file after each new
# snapshot, until it has run for `minutes` or the job's 6-hour limit. Allow about 10 minutes for R setup before the
# first cycle. Only one writer at a time: stop the laptop's command before starting this, and stop this before
# restarting the laptop.
#
# Sources (the VEC refused the results feed on 11 Nov 2026, so the night reads the VEC WEBSITE):
#   web       the night. Needs `index`. The only source allowed to write the live key.
#   web-2022  rehearsal on the 2022 result pages (87 districts, Narracan dropped); test key only.
#   sample    the VEC's public 2026 sample FEED (6 districts); the feed path, kept for its tests; test key only.
# The test key is never read by the live page; view it with ?nightsrc=https://data.inthegame.blog/auspol/night/test-vic2026.json
#
# Inputs it downloads, since none is in git: the night state (forecast-latest release, written by fit_seats_full.R
# every daily run; polling day's copy is the afternoon forecast), the 2022 booth and turnout tables, and for the web
# sources night-web-inputs.tar.gz (venues, enrolment, candidates, the One Nation booth lean and the class split's
# inputs; scripts/publish_night_inputs.sh builds it, and must be rerun when any of them changes), all on the
# night-inputs release.
name: Election-night backup

on:
  workflow_dispatch:
    inputs:
      key:
        description: "R2 file to write (the live page reads auspol/night/vic2026.json)"
        type: choice
        options: ["auspol/night/test-vic2026.json", "auspol/night/vic2026.json"]
        default: "auspol/night/test-vic2026.json"
      source:
        description: "web (the night, VEC website; needs index), web-2022 (rehearsal on the 2022 pages) or sample (VEC 2026 sample feed)"
        type: choice
        options: ["web-2022", "web", "sample"]
        default: "web-2022"
      index:
        description: "source web only: the VEC results page that links every district's result page"
        default: ""
      minutes:
        description: "How long to keep polling, in minutes, 1 to 330 (a larger value is cut to 330)"
        default: "10"
      every:
        description: "Seconds between fetches of the VEC pages (at least 10; one fetch of 174 pages takes about a minute)"
        default: "90"

# One group per key: a test run never queues ahead of a break-glass run on the live key, and two runs on the same key never
# write at once (a newer dispatch replaces an older one still queued).
concurrency:
  group: night-backup-${{ inputs.key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse the live key with test data, and source web without an index
        # sample and web-2022 are test data: they must never reach the file the public page reads
        env:
          SOURCE: ${{ inputs.source }}
          KEY: ${{ inputs.key }}
          INDEX: ${{ inputs.index }}
        run: |
          if [ "$SOURCE" != "web" ] && [ "$KEY" = "auspol/night/vic2026.json" ]; then
            echo "::error::source $SOURCE is test data: it may only write the test key, not auspol/night/vic2026.json"; exit 1
          fi
          if [ "$SOURCE" = "web" ]; then
            case "$INDEX" in https://www.vec.vic.gov.au/*) ;; *) echo "::error::source web needs index = a https://www.vec.vic.gov.au/ results page (got '$INDEX')"; exit 1 ;; esac
          fi

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::devtools, any::jsonlite, any::xml2, any::curl
          needs: check

      - name: Download the night state and the 2022 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Three tries per release download (scripts/gh_retry.sh; a one-off API failure killed the 19 Nov forecast run).
          source scripts/gh_retry.sh
          mkdir -p output
          gh release download forecast-latest -p night-state-vic-2026.rds -D output --clobber
          gh release download night-inputs -p booths-vic2026-ref.csv -p council-district-stats-2022.csv -D output --clobber
          # Upper-house booth lean for parties new to a seat (One Nation): optional. Absent from the release, the loop runs
          # without it and says so (NW15!), as the night model did before 30 Oct.
          if [ "${{ inputs.source }}" = "sample" ]; then
            gh release download night-inputs -p council-fp-2022.csv -D output --clobber \
              || echo "::warning::night-inputs has no council-fp-2022.csv: the backup runs WITHOUT the One Nation booth lean"
          else
            # the website night's machine-local inputs, unpacked at their repo paths (scripts/publish_night_inputs.sh).
            # Required: without them night_vic2026.sh stops (NV2!) or the class split goes off (NW23!).
            gh release download night-inputs -p night-web-inputs.tar.gz -D . --clobber
            tar -xzf night-web-inputs.tar.gz
            echo "NBI2  bundle uploaded $(gh release view night-inputs --json assets -q '.assets[] | select(.name=="night-web-inputs.tar.gz") | .updatedAt')"
            tar -tzf night-web-inputs.tar.gz | xargs sha1sum | sed 's/^/NBI2  /'
          fi
          # published_flags.R's startup check (validate_flow_arm) refuses to run without the shipped flow models' manifest;
          # the night never uses the flow models themselves (the night state carries the flows), so the manifest alone is enough.
          # Tag read from the published flags, as forecast.yaml does, so a new flow tag cannot leave this behind
          FTF_TAG=$(Rscript -e 'source("scripts/published_flags.R"); cat(if (identical(PUBLISHED_FLAGS[["AUSPOL_FLOW_TF"]], "1")) PUBLISHED_FLAGS[["AUSPOL_FLOW_MODEL_TAG"]] else "")')
          if [ -n "$FTF_TAG" ]; then
            gh release download shipped-models -p "xgb-flows-$FTF_TAG-asat-manifest.csv" -D output --clobber
            ls -la "output/xgb-flows-$FTF_TAG-asat-manifest.csv"
          fi
          ls -la output/night-state-vic-2026.rds output/booths-vic2026-ref.csv output/council-district-stats-2022.csv
          Rscript -e 'st <- readRDS("output/night-state-vic-2026.rds"); cat("night state:", st$pair, nrow(st$shares), "seats,", st$n_sims, "sims, saved", if (is.null(st$saved_at)) "(no date)" else st$saved_at, "\n")'

      - name: Get the snapshot source
        id: src
        run: |
          set -e
          if [ "${{ inputs.source }}" = "sample" ]; then
            # the VEC's public 2026 sample pack (feed research, issue #149)
            curl -fsSL --retry 3 -o sample2026.zip "https://www.vec.vic.gov.au/-/media/04d4aa2108084aa98478adc06fa0a078.zip"
            unzip -q sample2026.zip -d feed
            dir="$(find feed -type d -name 'round 1 samples*' | head -n 1)"
            [ -n "$dir" ] || { echo "::error::no 'round 1 samples' folder in the VEC sample pack"; exit 1; }
            echo "dir=$dir" >> "$GITHUB_OUTPUT"; echo "allow=1" >> "$GITHUB_OUTPUT"
            ls "$dir" | head -n 5
          else
            echo "website source: night_vic2026.sh fetches its own snapshots"
          fi

      - name: Install wrangler
        # pinned, as in forecast.yaml: an unpinned CLI holding an API token is a supply-chain hole
        run: npm install -g wrangler@4.135.0 >/dev/null 2>&1 && wrangler --version

      - name: Run the night loop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SRC: ${{ steps.src.outputs.dir }}
          KEY: ${{ inputs.key }}
          MINUTES: ${{ inputs.minutes }}
          EVERY: ${{ inputs.every }}
          ALLOW: ${{ steps.src.outputs.allow }}
          SOURCE: ${{ inputs.source }}
          INDEX: ${{ inputs.index }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a whole number"; exit 1 ;; esac
          case "$EVERY" in ''|*[!0-9]*) echo "::error::every must be a whole number"; exit 1 ;; esac
          # 0 would mean no limit to timeout (the job would hit its cap and end red); every under 10 s just hammers the source
          [ "$MINUTES" -ge 1 ] || { echo "::error::minutes must be at least 1"; exit 1; }
          [ "$EVERY" -ge 10 ] || { echo "::error::every must be at least 10 seconds"; exit 1; }
          # 330 leaves 30 of the job's 360 minutes for R setup, downloads and saving the archive
          [ "$MINUTES" -le 330 ] || MINUTES=330
          # timeout ends the loop after MINUTES; exit 124 is that planned stop, not a failure (`|| rc=$?`: run steps use bash -e)
          rc=0
          if [ "$SOURCE" = "sample" ]; then
            LOG=night-archive/night-loop.log
            LEAN=()
            [ -s output/council-fp-2022.csv ] && LEAN=(--council-lean=output/council-fp-2022.csv)
            timeout "${MINUTES}m" Rscript scripts/night_loop.R --every="$EVERY" --source="$SRC" --archive=night-archive \
              --state=output/night-state-vic-2026.rds --ref=output/booths-vic2026-ref.csv \
              --turnout=output/council-district-stats-2022.csv --out=night-out/vic2026.json \
              "${LEAN[@]}" --allow-unmatched="${ALLOW:-0}" --upload-key="$KEY" || rc=$?
          else
            # THE NIGHT COMMAND, as on the laptop (it downloads the night state itself, into night-work/).
            # TERM from timeout reaches the script's trap, which stops the fetcher and the loop.
            LOG=night-work/archive/night-loop.log
            DRYARG=()
            if [ "$SOURCE" = "web-2022" ]; then
              DRYARG=(--dry-2022)
              INDEX="https://www.vec.vic.gov.au/results/state-election-results/2022-state-election-results"
            fi
            timeout "${MINUTES}m" bash scripts/night_vic2026.sh "$INDEX" night-work --upload-key="$KEY" --every="$EVERY" "${DRYARG[@]}" || rc=$?
            echo "--- fetch.log, last lines"; tail -n 5 night-work/fetch.log || true
          fi
          [ "$rc" -eq 124 ] && { echo "loop stopped after ${MINUTES} minutes, as asked"; rc=0; }
          grep -E "OK |FAILED|NWU|NWL|NW23|NW24" "$LOG" | tail -n 20 || true
          # the loop logs a failed upload and carries on; a run whose uploads all failed must not look green
          if ! grep -q "NWU3  uploaded" "$LOG"; then echo "::error::no cycle was uploaded"; exit 1; fi
          exit $rc

      - name: Keep the raw snapshots and the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-archive-${{ github.run_id }}
          path: |
            night-archive/
            night-out/
            night-work/
          if-no-files-found: warn
          retention-days: 30
